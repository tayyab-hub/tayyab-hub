<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Tayyab — Software Engineer, Full-Stack and Backend</title>
  <desc id="d">Computer Science student at Methodist College Kuala Lumpur, building full-stack web apps, APIs and desktop tools. Open to software engineering internships from January 2027.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1220"/><stop offset=".6" stop-color="#0E1B30"/><stop offset="1" stop-color="#12284A"/></linearGradient>
    <radialGradient id="glow" cx=".82" cy=".2" r=".6"><stop stop-color="#2F81F7" stop-opacity=".28"/><stop offset="1" stop-color="#2F81F7" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#58A6FF"/><stop offset="1" stop-color="#3FB950"/></linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#3B5A85" fill-opacity=".35"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="url(#glow)"/>
  <rect x="700" y="0" width="580" height="400" fill="url(#dots)" opacity=".7"/>
  <rect x="0" y="396" width="1280" height="4" fill="url(#accent)"/>
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
