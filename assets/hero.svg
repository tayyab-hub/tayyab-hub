    <text x="114" y="71" font-size="15" letter-spacing="3" fill="#8FA9C8" font-weight="600">SOFTWARE ENGINEER · FULL-STACK &amp; BACKEND</text>
    <text x="62" y="148" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#F0F6FF">Muhammad Tayyab</text>
    <text x="64" y="200" font-size="23" fill="#C3D3E8">I build full-stack web apps, REST APIs and desktop tools,</text>
    <text x="64" y="232" font-size="23" fill="#C3D3E8">and ship them with tests, docs and stated limits.</text>
    <text x="64" y="282" font-size="17" fill="#7F98B8">Diploma in Computer Science · Methodist College Kuala Lumpur · CGPA 3.49</text>
    <rect x="64" y="318" width="317" height="36" rx="18" fill="#0F2E24" stroke="#2EA043"/><circle cx="83" cy="336" r="5" fill="#3FB950"/><text x="95" y="341.5" font-size="16" fill="#7EE787" font-weight="600">Open to internships · Jan 2027</text><rect x="392.8" y="318" width="227" height="36" rx="18" fill="#14233A" stroke="#2B4366"/><text x="407.8" y="341.5" font-size="16" fill="#B9CBE2" font-weight="400">Kuala Lumpur, Malaysia</text>
  </g>
