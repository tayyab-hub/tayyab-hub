<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-labelledby="t d">
  <title id="t">ResumeIQ — Explainable resume &amp; job matching</title>
  <desc id="d">Parses PDF resumes, compares skills against a job description and explains an 8-category score. Built with React, TypeScript, FastAPI, PostgreSQL.</desc>
